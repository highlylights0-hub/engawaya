<!DOCTYPE html>
<!--
    ────────────────────────────────────────────────
      ゴテゴテ空戦（gotegote/）

      この部屋を建てた理由
        2026-10-04、博喜さんが蔵人に「遊びましょう」と声をかけ、
        「ゴテゴテの戦闘機のドッグファイト」と言ったのが始まり。
        その席で作ったものを「TOPのどこかに置いてOK」とのことで、母屋に上げた。
        道具ではなく、用がなくても座っていける場所のひとつ。

      遊びのきまり
        ・自機は飾りを12個つけて出撃する。撃たれるたびに飾りが1個取れて落ちる。
        ・飾りが一つも無い丸裸のときに撃たれたら墜落。
        ・落ちていく飾りは、海に着く前に体当たりすれば付け直せる。
        ・飾りが多いほど弾が増える（4個で2連、8個で3連）。かわりに機首が少し重い。
          → 守るほど強くなる、だから拾いに行きたくなる、という作り。

      この部屋の掟（母屋の憲法との付き合い方）
        ①外から読み込まない：はじめは Google のフォントを読み込んでいたが、
          母屋に上げるときに外した。字は閲覧機に入っている太いゴシックを使う。
        ②絵文字を使わない：機体も飾りも canvas に線と面で描いている。
          操作の札は「左」「右」などの字にした（記号は機械で形が変わるため）。
        ③押す場所を大きく：スマホの操作ボタンは 72px と 84px（主役の寸法）。
        ・色は遊びの絵の色なので、DESIGN.md の色表の外。変数の名前も
          共通の表（--sumi など）と重ならないようにしてある＝棟割りに載せない。
        ・PS などのコントローラーにも対応（閲覧機の Gamepad API）。
          ボタンを一度押すまで、閲覧機はコントローラーを認識しない。
    ────────────────────────────────────────────────
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゴテゴテ空戦 — 縁側屋</title>
<meta name="description" content="縁側屋の遊び場。撃たれるたびに飾りが取れていく、ゴテゴテの戦闘機の空中戦。無料・インストール不要・ブラウザだけで遊べます。">
<link rel="icon" href="../favicon.png">
<style>
/* Layout: full-bleed canvas sky at dusk, thin HUD floating over the corners, one gaudy title card */
:root{
  --yoru:#170833; --sumi:#14072b; --beni:#e2366f; --kin:#ffd84a; --kinari:#fff4dc; --sorairo:#9fe3ff;
  --display:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --head:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
/* hidden を付けたものは必ず隠す（下の display:flex などに負けないように） */
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--yoru);color:var(--kinari);font-family:var(--body)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hud>div{display:flex;flex-direction:column;gap:2px}
#hud .r{align-items:flex-end}
.lbl{font-weight:800;font-size:11px;letter-spacing:.14em;opacity:.85}
.num{font-family:var(--head);font-weight:900;font-size:28px;color:var(--kin);text-shadow:2px 2px 0 var(--beni),4px 4px 0 var(--sumi);font-variant-numeric:tabular-nums;line-height:1.05}
#mute{pointer-events:auto;margin-top:6px;min-height:48px;font:800 13px var(--body);color:var(--kinari);background:rgba(20,7,43,.5);border:1px solid rgba(255,244,220,.4);border-radius:999px;padding:0 16px;cursor:pointer}
#mute:focus-visible{outline:2px solid var(--kin);outline-offset:2px}
#gote{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#pips{display:flex;gap:3px}
.pip{width:18px;height:21px;border-radius:4px;font:800 11px var(--head);display:grid;place-items:center;background:rgba(255,255,255,.07);color:rgba(255,244,220,.28);border:1px solid rgba(255,244,220,.15)}
.pip.on{background:linear-gradient(#fff3b0,#ffd84a 50%,#b07a12);color:var(--sumi);border-color:#fff3b0}
@media (max-width:600px){#gote{top:calc(env(safe-area-inset-top,0px) + 124px)}.pip{width:15px;height:18px;font-size:9px}.num{font-size:22px}}
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(20,7,43,.25),rgba(20,7,43,.82));overflow:auto}
.panel{max-width:540px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.eyebrow{font:800 12px var(--body);letter-spacing:.3em;color:var(--sorairo)}
h1{font-family:var(--display);font-weight:900;letter-spacing:.04em;font-size:clamp(46px,13vw,96px);color:var(--kin);text-shadow:3px 3px 0 var(--beni),6px 6px 0 var(--sumi),0 0 36px rgba(255,200,80,.55);margin:0;line-height:1.05;text-wrap:balance}
.tag{font-size:16px;line-height:1.75;margin:0;max-width:30em;text-wrap:pretty}
.tag b{color:var(--kin)}
.keys{display:grid;grid-template-columns:auto auto;gap:8px 14px;text-align:left;font-size:14px;margin:0}
.keys dt{text-align:right}
.keys dd{margin:0}
kbd{font:800 13px var(--head);background:var(--kinari);color:var(--sumi);border-radius:5px;padding:1px 7px;box-shadow:0 3px 0 var(--kin);display:inline-block;margin:0 1px}
#result{font-family:var(--head);font-weight:900;font-size:22px;color:var(--kinari);margin:0}
#result span{color:var(--kin)}
#go{font-family:var(--head);font-weight:900;font-size:24px;padding:14px 44px;border:0;border-radius:999px;background:linear-gradient(#fff3b0,#ffd84a 45%,#d99a1e);color:var(--sumi);box-shadow:0 5px 0 var(--beni),0 12px 26px rgba(0,0,0,.45);cursor:pointer}
#go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--beni)}
#go:focus-visible{outline:3px solid var(--kinari);outline-offset:4px}
#touch{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:space-between;pointer-events:none}
#touch .grp{display:flex;gap:12px;align-items:flex-end}
.tb{pointer-events:auto;width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,244,220,.5);background:rgba(20,7,43,.45);color:var(--kinari);font:800 17px var(--head);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tb.big{width:84px;height:84px}
.tb.on{background:rgba(255,216,74,.6);color:var(--sumi)}
/* リンクの色（総括）。無いと閲覧機の既定の青が夜空に沈む（DESIGN.md「3.」） */
a{color:var(--kin)}
.modoru{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;font-weight:800;font-size:15px;text-decoration:none;border-bottom:1px solid transparent}
.modoru:hover,.modoru:focus-visible{border-bottom-color:var(--kin);outline:none}
@media (prefers-reduced-motion:reduce){#go{transition:none}}
</style>
</head>
<body>

<canvas id="game" aria-label="ゴテゴテ空戦のゲーム画面"></canvas>

<div id="hud">
  <div><span class="lbl">SCORE</span><span class="num" id="score">0</span><span class="lbl">WAVE <span id="wave">1</span></span></div>
  <div class="r"><span class="lbl">HI-SCORE</span><span class="num" id="hi">0</span><button id="mute" type="button">音 ON</button></div>
</div>
<div id="gote" hidden><span class="lbl">ゴテゴテ度</span><div id="pips"></div></div>

<div id="overlay">
  <div class="panel">
    <span class="eyebrow" id="eyebrow">DOGFIGHT OVER THE DUSK SEA</span>
    <h1 id="ttl">ゴテゴテ<br>空戦</h1>
    <p class="tag" id="tag">撃たれるたびに<b>飾りが1個ずつ取れていく</b>。丸裸で撃たれたら墜落。<br>取れた飾りは空中で拾えば付け直せます。飾りが多いほど弾も増える。</p>
    <p id="result" hidden></p>
    <dl class="keys" id="keys">
      <dt><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd></dt><dd>機首を回す</dd>
      <dt><kbd>↑</kbd> / <kbd>W</kbd></dt><dd>噴射</dd>
      <dt><kbd>Space</kbd> / <kbd>J</kbd></dt><dd>撃つ</dd>
    </dl>
    <button id="go" type="button">出撃！</button>
    <a class="modoru" href="../">縁側屋の玄関へ戻る</a>
  </div>
</div>

<div id="touch" hidden>
  <div class="grp"><button class="tb" data-k="left" type="button">左</button><button class="tb" data-k="right" type="button">右</button></div>
  <div class="grp"><button class="tb" data-k="up" type="button">噴射</button><button class="tb big" data-k="fire" type="button">発射</button></div>
</div>

<script>
(() => {
// canvas の字も閲覧機に入っている字で描く（憲法①：外からフォントを読まない）
const JPF = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let cw, ch, dpr, zoom;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = innerWidth; ch = innerHeight;
  cv.width = cw * dpr; cv.height = ch * dpr;
  zoom = Math.max(0.55, Math.min(1.1, Math.min(cw, ch) / 640));
}
addEventListener('resize', resize); resize();

const W = 5000, GY = 900, CEIL = -700, TAU = Math.PI * 2;
const wrap = x => ((x % W) + W) % W;
const dxw = (a, b) => { let d = (b - a) % W; if (d > W/2) d -= W; if (d < -W/2) d += W; return d; };
const angN = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- 飾りパーツ ----------
const PARTS = [
  {id:'crown',   name:'王冠',       ab:'冠', ax:6,   ay:-17},
  {id:'topwing', name:'金の複葉',   ab:'複', ax:2,   ay:-15},
  {id:'chand',   name:'シャンデリア', ab:'燭', ax:0,  ay:14},
  {id:'disco',   name:'ミラーボール', ab:'球', ax:-22, ay:15},
  {id:'drill',   name:'ドリル',     ab:'錐', ax:46,  ay:0},
  {id:'ribbon',  name:'リボン',     ab:'帯', ax:-56, ay:0},
  {id:'cannon',  name:'増設砲',     ab:'砲', ax:11,  ay:10},
  {id:'neon',    name:'ネオン尾翼', ab:'尾', ax:-33, ay:-18},
  {id:'flag',    name:'大漁旗',     ab:'旗', ax:-38, ay:-28},
  {id:'feather', name:'羽飾り',     ab:'羽', ax:-14, ay:-20},
  {id:'jewel',   name:'宝石',       ab:'宝', ax:0,   ay:1},
  {id:'goldprop',name:'金プロペラ', ab:'金', ax:40,  ay:0},
];
const PMAP = Object.fromEntries(PARTS.map(p => [p.id, p]));
const ALL = PARTS.map(p => p.id);
const BACK = ['ribbon','neon','flag','feather','disco','chand'];
const FRONT = ['topwing','cannon','jewel','crown','drill'];

const G1 = '#ffd84a', G2 = '#b07a12', G3 = '#fff3b0';
function gold(x0, y0, x1, y1){ const g = ctx.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,G3); g.addColorStop(.45,G1); g.addColorStop(1,G2); return g; }
function poly(pts){ ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
function gem(x, y, r, c){ ctx.fillStyle = c; poly([[x,y-r*1.3],[x+r,y],[x,y+r*1.3],[x-r,y]]); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(x-r*.35, y-r*.7, r*.4, r*.4); }
const GEMS = ['#ff3d7f','#35d0ff','#7dff8a','#c58bff','#ff9a3d'];

const PD = {
  crown(t){
    ctx.fillStyle = gold(0,-26,0,-11);
    poly([[-3,-11],[-4,-22],[1,-16],[6,-26],[11,-16],[16,-22],[15,-11]]); ctx.fill();
    ctx.strokeStyle = G2; ctx.lineWidth = 1; ctx.stroke();
    gem(6,-15,2.2,'#ff3d7f'); gem(1,-13.5,1.4,'#35d0ff'); gem(11,-13.5,1.4,'#7dff8a');
    ctx.fillStyle = '#fff'; [[-4,-22],[6,-26],[16,-22]].forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x,y,1.6,0,TAU); ctx.fill(); });
  },
  topwing(t){
    ctx.strokeStyle = G2; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-6,-4); ctx.lineTo(-8,-15); ctx.moveTo(10,-5); ctx.lineTo(12,-15); ctx.moveTo(-6,-4); ctx.lineTo(12,-15); ctx.stroke();
    ctx.fillStyle = gold(0,-19,0,-12); ctx.beginPath(); ctx.ellipse(2,-16,22,3.6,0,0,TAU); ctx.fill();
    ctx.fillStyle = '#ff3d7f'; ctx.fillRect(-12,-17,3,3); ctx.fillRect(14,-17,3,3);
  },
  chand(t){
    ctx.save(); ctx.translate(0,6); ctx.rotate(Math.sin(t*3.2)*.35);
    ctx.strokeStyle = G2; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,9); ctx.stroke();
    ctx.fillStyle = gold(0,8,0,13); ctx.beginPath(); ctx.ellipse(0,10,11,2.4,0,0,TAU); ctx.fill();
    for (const x of [-9,-3,3,9]){
      ctx.fillStyle = '#fff4dc'; ctx.fillRect(x-1,4,2,5);
      ctx.fillStyle = Math.random() < .5 ? '#ffb13d' : '#ffe27a'; ctx.beginPath(); ctx.ellipse(x,2.6,1.3,2.1,0,0,TAU); ctx.fill();
      ctx.fillStyle = 'rgba(160,230,255,.9)'; gem(x,15,1.3,'rgba(170,235,255,.95)');
    }
    gem(0,18,2,'#bff0ff');
    ctx.restore();
  },
  disco(t){
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-22,5); ctx.lineTo(-22,9); ctx.stroke();
    const g = ctx.createRadialGradient(-24,13,1,-22,15,7); g.addColorStop(0,'#fff'); g.addColorStop(1,'#7c86a8');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(-22,15,6.5,0,TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(40,40,70,.45)'; ctx.lineWidth = .7;
    for (let i = -2; i <= 2; i++){ ctx.beginPath(); ctx.moveTo(-28.5,15+i*2.6); ctx.lineTo(-15.5,15+i*2.6); ctx.stroke(); }
    const o = (t*8) % 2.6;
    for (let i = -3; i <= 3; i++){ const x = -22 + i*2.6 + o; if (Math.abs(x+22) < 6){ ctx.beginPath(); ctx.moveTo(x,9); ctx.lineTo(x,21); ctx.stroke(); } }
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++){ const a = t*2 + i*TAU/4; ctx.beginPath(); ctx.moveTo(-22+Math.cos(a)*8,15+Math.sin(a)*8); ctx.lineTo(-22+Math.cos(a)*12,15+Math.sin(a)*12); ctx.stroke(); }
  },
  drill(t){
    ctx.fillStyle = gold(36,-7,36,7); poly([[35,-7],[58,0],[35,7]]); ctx.fill();
    ctx.save(); poly([[35,-7],[58,0],[35,7]]); ctx.clip();
    ctx.strokeStyle = 'rgba(120,70,0,.6)'; ctx.lineWidth = 1.6;
    const o = (t*50) % 6;
    for (let x = 30 + o; x < 60; x += 6){ ctx.beginPath(); ctx.moveTo(x,-8); ctx.lineTo(x+4,8); ctx.stroke(); }
    ctx.restore();
  },
  ribbon(t){
    for (const [c, off, ph] of [['#ff3d7f',-3,0],['#35d0ff',3,1.6],['#ffd84a',0,3.1]]){
      ctx.strokeStyle = c; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.beginPath();
      for (let i = 0; i <= 12; i++){ const x = -34 - i*4.4, y = off + Math.sin(t*9 - i*.7 + ph) * i * .55; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
      ctx.stroke();
    }
  },
  cannon(t){
    ctx.fillStyle = '#3a3550'; ctx.beginPath(); ctx.roundRect(-2,7,26,6,3); ctx.fill();
    ctx.fillStyle = G1; ctx.fillRect(3,7,2.5,6); ctx.fillRect(14,7,2.5,6);
    ctx.fillStyle = '#1b1830'; ctx.beginPath(); ctx.arc(24,10,2.4,0,TAU); ctx.fill();
  },
  neon(t){
    const pulse = .6 + .4*Math.sin(t*6);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = `rgba(53,208,255,${.25*pulse})`; ctx.lineWidth = 7; poly([[-22,-4],[-42,-32],[-34,-32],[-16,-4]]); ctx.stroke();
    ctx.fillStyle = 'rgba(255,61,127,.75)'; ctx.fill();
    ctx.strokeStyle = '#9ff4ff'; ctx.lineWidth = 1.8; ctx.stroke();
  },
  flag(t){
    ctx.strokeStyle = G1; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(-30,-8); ctx.lineTo(-30,-40); ctx.stroke();
    ctx.fillStyle = G3; ctx.beginPath(); ctx.arc(-30,-41,2,0,TAU); ctx.fill();
    const pts = [];
    for (let i = 0; i <= 6; i++) pts.push([-30 - i*4, -39 + Math.sin(t*10 - i*.9) * i * .5]);
    ctx.beginPath(); ctx.moveTo(-30,-39);
    pts.forEach(p => ctx.lineTo(p[0], p[1]));
    for (let i = 6; i >= 0; i--) ctx.lineTo(pts[i][0], pts[i][1] + 13);
    ctx.closePath(); ctx.fillStyle = '#e8203c'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.4; ctx.beginPath();
    pts.forEach((p, i) => { const y = p[1] + 6.5 + Math.sin(i*1.2) * 1.5; i ? ctx.lineTo(p[0], y) : ctx.moveTo(p[0], y); }); ctx.stroke();
    ctx.fillStyle = G1; ctx.beginPath(); ctx.arc(pts[4][0], pts[4][1] + 4, 2, 0, TAU); ctx.fill();
  },
  feather(t){
    const cols = ['#ff3d7f','#ff9a3d','#ffd84a','#7dff8a','#35d0ff','#c58bff'];
    ctx.lineCap = 'round'; ctx.lineWidth = 3;
    cols.forEach((c, i) => {
      const sw = Math.sin(t*5 + i) * 1.5;
      ctx.strokeStyle = c; ctx.beginPath(); ctx.moveTo(-4,-9);
      ctx.quadraticCurveTo(-8 - i*2, -22 - (5-i), -16 - i*3.4 + sw, -26 + i*3 + sw); ctx.stroke();
    });
  },
  jewel(t){
    [-24,-14,-4,16,26].forEach((x, i) => {
      const tw = 1.6 + .5*Math.sin(t*7 + i*2);
      gem(x, 1, tw, GEMS[i]);
    });
  },
};
function drawProp(t, golden){
  const L = golden ? 15 : 11;
  ctx.fillStyle = golden ? 'rgba(255,216,74,.28)' : 'rgba(255,255,255,.18)';
  ctx.beginPath(); ctx.ellipse(41,0,2.4,L,0,0,TAU); ctx.fill();
  ctx.strokeStyle = golden ? G1 : '#ddd'; ctx.lineWidth = golden ? 3 : 2.2; ctx.lineCap = 'round';
  const s = Math.sin(t*55) * L;
  ctx.beginPath(); ctx.moveTo(41,-s); ctx.lineTo(41,s); ctx.stroke();
  ctx.fillStyle = golden ? gold(37,-4,37,4) : '#9aa0b8';
  poly([[37,-4],[45,0],[37,4]]); ctx.fill();
}
PD.goldprop = t => drawProp(t, true);

const PAL = [
  {base:'#ff4f8b', light:'#ffc2d8', dark:'#a3164d', stripe:'#ffd84a'},
  {base:'#3f86c9', light:'#c6e6ff', dark:'#1d3f73', stripe:'#e8f0ff'},
];
function drawBody(team){
  const c = PAL[team];
  ctx.fillStyle = c.dark; poly([[-34,-2],[-41,-17],[-31,-17],[-20,-2]]); ctx.fill();
  const g = ctx.createLinearGradient(0,-8,0,8); g.addColorStop(0,c.light); g.addColorStop(.45,c.base); g.addColorStop(1,c.dark);
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(-37,-1); ctx.quadraticCurveTo(-10,-10,20,-7); ctx.quadraticCurveTo(38,-5,38,0);
  ctx.quadraticCurveTo(38,5,20,7); ctx.quadraticCurveTo(-10,9,-37,2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(175,232,255,.92)'; ctx.beginPath(); ctx.ellipse(6,-6,9,6,0,Math.PI,0); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(3,-9,3,1.3,-.3,0,TAU); ctx.fill();
  ctx.fillStyle = c.dark; ctx.beginPath(); ctx.ellipse(2,4,18,3.2,.05,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-30,1,8,2,0,0,TAU); ctx.fill();
  ctx.fillStyle = c.stripe; ctx.fillRect(-18,-4,4,9);
}

// ---------- 状態 ----------
let state = 'title', player, enemies = [], bullets = [], pickups = [], parts = [], popups = [];
let score = 0, wave = 0, waveTimer = 0, banner = null, overTimer = 0, shake = 0, time = 0;
let hi = 0; try { hi = +localStorage.getItem('gotegote-hi') || 0; } catch(e) {}
const cam = {x:0, y:300};

function makePlane(x, y, a, team, ps){
  return {x, y, a, vx:Math.cos(a)*320, vy:Math.sin(a)*320, team, parts:[...ps], cd:rnd(.5,1.2), inv:0, alive:true,
          t:Math.random()*10, jink:0, jt:0, thrust:false, turn: 2.3};
}
function toWorld(pl, lx, ly){ if (Math.cos(pl.a) < 0) ly = -ly; const c = Math.cos(pl.a), s = Math.sin(pl.a); return [pl.x + lx*c - ly*s, pl.y + lx*s + ly*c]; }

// ---------- 音 ----------
let ac = null, muted = false, noiseBuf = null, lastShoot = 0;
function ensureAudio(){
  if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1; } catch(e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f, dur, type, vol, slide, delay = 0){
  if (!ac || muted) return; const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
  o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function noise(dur, vol, freq){
  if (!ac || muted) return; const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(); s.stop(ac.currentTime + dur);
}
const sfx = {
  shoot(){ if (time - lastShoot < .07) return; lastShoot = time; tone(900,.05,'square',.025,500); },
  eshoot(){ tone(320,.08,'sawtooth',.018,180); },
  hit(){ noise(.12,.16,2400); tone(1400,.12,'triangle',.05,500); },
  boom(){ noise(.8,.35,700); tone(120,.5,'sine',.15,40); },
  pick(){ tone(660,.08,'triangle',.07); tone(990,.14,'triangle',.07,null,.07); tone(1320,.16,'triangle',.05,null,.14); },
  wave(){ [523,659,784,1046].forEach((f,i) => tone(f,.18,'square',.04,null,i*.1)); },
};
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? '音 OFF' : '音 ON'; ensureAudio(); muteBtn.blur(); });

// ---------- 入力 ----------
const inp = {left:false, right:false, up:false, fire:false};
const KEYMAP = {ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'up', KeyW:'up', Space:'fire', KeyJ:'fire', KeyZ:'fire'};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k){ inp[k] = true; e.preventDefault(); }
  if ((e.code === 'Enter' || e.code === 'Space') && state !== 'play' && !overlay.hidden && overTimer <= 0) startGame();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k){ inp[k] = false; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in inp) inp[k] = false; });
const touchEl = document.getElementById('touch');
const isTouch = matchMedia('(pointer: coarse)').matches;
document.querySelectorAll('.tb').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); inp[k] = true; b.classList.add('on'); ensureAudio(); };
  const off = e => { e.preventDefault(); inp[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
// ---------- ゲームパッド (PS配列 / standard mapping) ----------
const pad = {left:false, right:false, up:false, fire:false, axis:0, connected:false, prevStart:false};
const PAD_KEYS = '<dt><kbd>左スティック</kbd> / <kbd>十字←→</kbd></dt><dd>機首を回す</dd><dt><kbd>R2</kbd> / <kbd>○</kbd> / <kbd>十字↑</kbd></dt><dd>噴射</dd><dt><kbd>×</kbd> / <kbd>□</kbd> / <kbd>R1</kbd></dt><dd>撃つ（押しっぱなしで連射）</dd><dt><kbd>OPTIONS</kbd> / <kbd>×</kbd></dt><dd>出撃</dd>';
let keysHtml = null, toast = null;
function getPad(){
  let list = [];
  try { list = navigator.getGamepads ? navigator.getGamepads() : []; } catch(e) { return null; }
  for (const g of list) if (g && g.connected) return g;
  return null;
}
function pollPad(){
  const g = getPad();
  if (!g){
    if (pad.connected){ pad.connected = false; Object.assign(pad, {left:false, right:false, up:false, fire:false, axis:0}); }
    return;
  }
  if (!pad.connected){
    pad.connected = true; toast = {text:'コントローラー接続！', life:2};
    const k = document.getElementById('keys'); if (keysHtml === null) keysHtml = k.innerHTML; k.innerHTML = PAD_KEYS;
  }
  const b = i => !!(g.buttons[i] && (g.buttons[i].pressed || g.buttons[i].value > .3));
  const ax = g.axes[0] || 0;
  pad.axis = Math.abs(ax) > .18 ? ax : 0;
  pad.left = b(14); pad.right = b(15);
  pad.up = b(7) || b(1) || b(12);
  pad.fire = b(0) || b(2) || b(5);
  const start = b(9) || b(0);
  if (start && !pad.prevStart && state !== 'play' && state !== 'dying' && !overlay.hidden) startGame();
  pad.prevStart = start;
}
function rumble(strong, weak, ms){
  const g = getPad(); const v = g && g.vibrationActuator;
  if (v && v.playEffect) v.playEffect('dual-rumble', {duration:ms, strongMagnitude:strong, weakMagnitude:weak}).catch(() => {});
}
addEventListener('gamepadconnected', () => ensureAudio());

if (isTouch){
  document.getElementById('keys').innerHTML = '<dt><kbd>左</kbd><kbd>右</kbd></dt><dd>機首を回す</dd><dt><kbd>噴射</kbd></dt><dd>加速</dd><dt><kbd>発射</kbd></dt><dd>撃つ</dd>';
}

// ---------- HUD ----------
const $score = document.getElementById('score'), $wave = document.getElementById('wave'), $hi = document.getElementById('hi');
const pipsEl = document.getElementById('pips');
const pipEls = PARTS.map(p => { const s = document.createElement('span'); s.className = 'pip'; s.textContent = p.ab; s.title = p.name; pipsEl.appendChild(s); return s; });
let hudKey = '';
function updateHud(){
  const owned = player ? player.parts : [];
  const key = score + '|' + wave + '|' + hi + '|' + owned.join(',');
  if (key === hudKey) return; hudKey = key;
  $score.textContent = score; $wave.textContent = Math.max(1, wave); $hi.textContent = hi;
  PARTS.forEach((p, i) => pipEls[i].classList.toggle('on', owned.includes(p.id)));
}

// ---------- 演出 ----------
function popup(x, y, text, color){ popups.push({x, y, text, color, life:1.4}); }
function spark(x, y, n, cols, sp = 260){
  for (let i = 0; i < n && parts.length < 900; i++){ const a = rnd(0,TAU), s = rnd(40,sp);
    parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(.3,.7), max:.7, size:rnd(1.5,3.5), color:cols[i % cols.length], type:'spark'}); }
}
function puff(x, y, vx, vy, color, size, life, type = 'smoke'){ if (parts.length < 900) parts.push({x, y, vx, vy, life, max:life, size, color, type}); }

function explode(pl){
  pl.alive = false; sfx.boom();
  spark(pl.x, pl.y, 40, ['#ffd84a','#ff9a3d','#fff3b0','#ff3d7f'], 420);
  for (let i = 0; i < 16; i++) puff(pl.x + rnd(-14,14), pl.y + rnd(-14,14), rnd(-80,80), rnd(-120,40), 'rgba(60,40,70,.7)', rnd(8,18), rnd(.8,1.6));
  for (let i = 0; i < 6; i++) puff(pl.x, pl.y, rnd(-200,200), rnd(-260,60), '#ff9a3d', rnd(10,20), rnd(.3,.6), 'fire');
  if (pl.team){
    const pts = 100 + wave*25; score += pts;
    popup(pl.x, pl.y - 20, `撃墜！ +${pts}`, '#ffd84a'); shake = Math.max(shake, 8); rumble(.3, .6, 120);
  } else {
    shake = 18; overTimer = 1.8; state = 'dying'; rumble(1, 1, 600);
  }
}
function hit(pl){
  if (!pl.alive) return;
  if (!pl.team && (pl.inv > 0 || state !== 'play')) return;
  if (pl.parts.length){
    const id = pl.parts.splice(Math.floor(Math.random() * pl.parts.length), 1)[0];
    pickups.push({x:pl.x, y:pl.y, vx:pl.vx*.35 + rnd(-140,140), vy:-rnd(140,280), id, rot:0, spin:rnd(-7,7), age:0, life:15, landed:false});
    popup(pl.x, pl.y - 44, `${PMAP[id].name}が取れた！`, pl.team ? '#9fe3ff' : '#ffd84a');
    spark(pl.x, pl.y, 14, ['#ffd84a','#fff','#ff3d7f']);
    sfx.hit();
    if (pl.team) score += 10; else { pl.inv = .45; shake = Math.max(shake, 7); rumble(.7, .5, 160); }
  } else explode(pl);
}

// ---------- 進行 ----------
const overlay = document.getElementById('overlay');
function startGame(){
  ensureAudio();
  enemies = []; bullets = []; pickups = []; popups = []; parts = [];
  score = 0; wave = 0; overTimer = 0;
  player = makePlane(0, 350, 0, 0, ALL);
  cam.x = 0; cam.y = 350;
  state = 'play'; overlay.hidden = true; touchEl.hidden = !isTouch;
  // 飾りの札は遊んでいる間だけ出す（スマホ幅だとタイトルの字と重なるため）
  document.getElementById('gote').hidden = false;
  nextWave();
  cv.focus?.();
}
function nextWave(){
  wave++; banner = {text:`WAVE ${wave}`, sub: wave === 1 ? '飾りを守り抜け' : '敵もゴテゴテ度アップ', life:2.2};
  waveTimer = 1.4; sfx.wave();
}
function spawnWave(){
  const n = Math.min(7, 1 + Math.ceil(wave * .8));
  for (let i = 0; i < n; i++){
    const side = i % 2 ? 1 : -1;
    const x = wrap(player.x + side * rnd(800, 1400)), y = rnd(-250, 650);
    const k = Math.min(12, 1 + wave + Math.floor(Math.random() * 2));
    const ps = [...ALL].sort(() => Math.random() - .5).slice(0, k);
    const e = makePlane(x, y, side > 0 ? Math.PI : 0, 1, ps);
    e.turn = Math.min(3.1, 2.1 + wave * .1);
    enemies.push(e);
  }
}
function gameOver(){
  state = 'over';
  if (score > hi){ hi = score; try { localStorage.setItem('gotegote-hi', hi); } catch(e) {} }
  document.getElementById('eyebrow').textContent = 'SHOT DOWN';
  document.getElementById('ttl').innerHTML = '丸裸で<br>撃墜';
  document.getElementById('tag').innerHTML = '飾りは全部海の底。次はこまめに拾い直そう。';
  const r = document.getElementById('result'); r.hidden = false;
  r.innerHTML = `SCORE <span>${score}</span>　WAVE <span>${wave}</span>`;
  document.getElementById('go').textContent = 'もう一回出撃';
  overlay.hidden = false; touchEl.hidden = true;
  document.getElementById('gote').hidden = true;
  document.getElementById('go').focus();
}
document.getElementById('go').addEventListener('click', startGame);

// ---------- 物理 ----------
function fly(pl, thrust, dt){
  const ca = Math.cos(pl.a), sa = Math.sin(pl.a);
  const f = pl.y < CEIL ? .25 : 1;
  const power = pl.team ? 500 : 580;
  if (thrust){ pl.vx += ca * power * f * dt; pl.vy += sa * power * f * dt; }
  pl.vy += 280 * dt;
  const sp = Math.hypot(pl.vx, pl.vy);
  if (sp > 1){
    const va = Math.atan2(pl.vy, pl.vx), d = angN(pl.a - va);
    const k = Math.min(1, 2.4 * dt * Math.min(1, sp / 280));
    const na = va + d * k; pl.vx = Math.cos(na) * sp; pl.vy = Math.sin(na) * sp;
  }
  const drag = 1 - 1.1 * dt; pl.vx *= drag; pl.vy *= drag;
  pl.x = wrap(pl.x + pl.vx * dt); pl.y += pl.vy * dt;
  if (pl.y < CEIL - 300){ pl.y = CEIL - 300; if (pl.vy < 0) pl.vy = 0; }
  pl.t += dt;
  // 演出: きらきら・煙・噴射炎
  if (Math.random() < pl.parts.length / 12 * .9){
    const [gx, gy] = toWorld(pl, rnd(-36,30), rnd(-20,14));
    puff(gx, gy, pl.vx*.15 + rnd(-30,30), pl.vy*.15 + rnd(-30,30), GEMS[Math.floor(Math.random()*5)], rnd(1.5,3), rnd(.4,.8), 'glitter');
  }
  if (pl.parts.length === 0 && Math.random() < .5){
    const [sx, sy] = toWorld(pl, -20, 0); puff(sx, sy, rnd(-20,20), rnd(-40,0), 'rgba(80,70,90,.55)', rnd(5,10), rnd(.6,1.1));
  }
  if (thrust && Math.random() < .8){
    const [ex, ey] = toWorld(pl, -38, 0);
    puff(ex, ey, -ca*120 + rnd(-20,20), -sa*120 + rnd(-20,20), Math.random() < .5 ? '#ffb13d' : '#ff6a3d', rnd(2,4), rnd(.12,.25), 'fire');
  }
}
function fire(pl){
  const n = pl.team ? 1 : 1 + (pl.parts.length >= 4) + (pl.parts.length >= 8);
  const offs = n === 1 ? [0] : n === 2 ? [-.05,.05] : [-.1,0,.1];
  const spd = pl.team ? 640 : 980;
  const [mx, my] = toWorld(pl, 44, 0);
  for (const o of offs){
    const a = pl.a + o + (pl.team ? rnd(-.07,.07) : 0);
    bullets.push({x:mx, y:my, vx:Math.cos(a)*spd + pl.vx*.6, vy:Math.sin(a)*spd + pl.vy*.6, team:pl.team, life:pl.team ? 1.4 : 1.0});
  }
  if (pl.team){ if (onScreen(pl.x, pl.y, 100)) sfx.eshoot(); } else sfx.shoot();
}
function steerTo(pl, desired, dt){
  const d = angN(desired - pl.a);
  pl.a = angN(pl.a + clamp(d, -pl.turn * dt, pl.turn * dt));
  return d;
}

function update(dt){
  time += dt;
  if (player && player.alive){
    if (state === 'play'){
      const turn = 3.5 - player.parts.length * .04;
      let steer = (inp.right || pad.right ? 1 : 0) - (inp.left || pad.left ? 1 : 0);
      if (!steer && pad.axis) steer = Math.sign(pad.axis) * Math.min(1, (Math.abs(pad.axis) - .18) / .7);
      player.a += steer * turn * dt;
      player.thrust = inp.up || pad.up;
      player.cd -= dt;
      if ((inp.fire || pad.fire) && player.cd <= 0){ fire(player); player.cd = .12; }
    } else if (state === 'title'){
      player.turn = 2.2;
      const ty = 250 + Math.sin(time * .7) * 260;
      steerTo(player, Math.atan2(ty - player.y, 500), dt);
      player.thrust = true;
    }
    player.inv -= dt;
    fly(player, player.thrust, dt);
    if (player.y > GY - 14){
      player.y = GY - 14; player.vy = -Math.abs(player.vy) * .5 - 180;
      player.a = Math.cos(player.a) >= 0 ? -.7 : -Math.PI + .7;
      for (let i = 0; i < 14; i++) puff(player.x + rnd(-20,20), GY - 4, rnd(-90,90), rnd(-260,-80), 'rgba(200,230,255,.8)', rnd(2,4), rnd(.4,.8), 'spark');
      if (state === 'play') hit(player);
    }
  }

  // 敵AI
  for (const e of enemies){
    if (!e.alive) continue;
    const dx = dxw(e.x, player.x), dy = player.y - e.y, dist = Math.hypot(dx, dy);
    const lead = dist / 700;
    let desired = Math.atan2(dy + player.vy * lead, dx + player.vx * lead);
    e.jt -= dt; if (e.jt <= 0){ e.jt = rnd(1,2.4); e.jink = dist > 450 ? rnd(-.6,.6) : rnd(-.25,.25); }
    desired += e.jink;
    if (dist < 120) desired += Math.PI * .6;
    if (e.y > GY - 260 && e.vy > -50) desired = -Math.PI/2 + (Math.cos(e.a) >= 0 ? .5 : -.5) * 1;
    if (e.y < CEIL + 80) desired = Math.PI/2 * (Math.cos(e.a) >= 0 ? .6 : 1.4);
    const diff = steerTo(e, desired, dt);
    fly(e, true, dt);
    e.cd -= dt;
    if (state === 'play' && e.cd <= 0 && Math.abs(angN(Math.atan2(dy, dx) - e.a)) < .3 && dist < 650){ fire(e); e.cd = rnd(.55, 1.1) - Math.min(.3, wave * .03); }
    if (e.y > GY - 14) explode(e);
    if (state === 'play' && player.alive && dist < 36){
      hit(player); hit(e);
      const nx = dx / (dist || 1), ny = dy / (dist || 1);
      player.vx += nx * 200; player.vy += ny * 200; e.vx -= nx * 200; e.vy -= ny * 200;
    }
  }
  enemies = enemies.filter(e => e.alive);

  // 弾
  for (const b of bullets){
    b.x = wrap(b.x + b.vx * dt); b.y += b.vy * dt; b.life -= dt;
    if (b.y > GY){ b.life = 0; puff(b.x, GY - 2, 0, -60, 'rgba(200,230,255,.7)', 2, .3, 'spark'); }
    if (b.life <= 0) continue;
    const targets = b.team ? [player] : enemies;
    for (const p of targets){
      if (!p || !p.alive) continue;
      const ddx = dxw(b.x, p.x), ddy = p.y - b.y;
      if (ddx*ddx + ddy*ddy < 26*26){ b.life = 0; hit(p); break; }
    }
  }
  bullets = bullets.filter(b => b.life > 0);

  // 落ちてくる飾り
  for (const p of pickups){
    p.age += dt; p.life -= dt; p.rot += p.spin * dt;
    if (!p.landed){
      p.vy += 150 * dt; p.vx *= 1 - .6 * dt; p.vy *= 1 - .6 * dt;
      p.x = wrap(p.x + p.vx * dt); p.y += p.vy * dt;
      if (p.y > GY - 8){ p.y = GY - 8; p.landed = true; p.life = Math.min(p.life, 3); p.spin *= .2;
        for (let i = 0; i < 8; i++) puff(p.x, GY - 4, rnd(-60,60), rnd(-160,-40), 'rgba(200,230,255,.8)', rnd(1.5,3), .5, 'spark'); }
    } else p.y = GY - 8 + Math.sin(time * 3 + p.x) * 2;
    if (state === 'play' && player.alive && p.age > .7){
      const ddx = dxw(p.x, player.x), ddy = player.y - p.y;
      if (ddx*ddx + ddy*ddy < 48*48){
        p.life = 0; sfx.pick();
        if (!player.parts.includes(p.id)){ player.parts.push(p.id); popup(p.x, p.y - 30, `${PMAP[p.id].name} 装着！`, '#ffd84a'); }
        else { score += 50; popup(p.x, p.y - 30, '+50', '#fff3b0'); }
        spark(p.x, p.y, 12, ['#ffd84a','#fff3b0','#7dff8a']);
      }
    }
  }
  pickups = pickups.filter(p => p.life > 0);

  for (const q of parts){
    q.life -= dt; q.x = wrap(q.x + q.vx * dt); q.y += q.vy * dt;
    if (q.type === 'smoke'){ q.size += 14 * dt; q.vy -= 10 * dt; }
    else if (q.type === 'spark'){ q.vy += 300 * dt; q.vx *= .98; }
    else { q.vx *= .95; q.vy *= .95; }
  }
  parts = parts.filter(q => q.life > 0);
  for (const p of popups){ p.life -= dt; p.y -= 30 * dt; }
  popups = popups.filter(p => p.life > 0);
  if (banner){ banner.life -= dt; if (banner.life <= 0) banner = null; }

  if (state === 'play'){
    if (waveTimer > 0){ waveTimer -= dt; if (waveTimer <= 0) spawnWave(); }
    else if (enemies.length === 0){
      const missing = ALL.filter(id => !player.parts.includes(id));
      if (missing.length){ const id = missing[Math.floor(Math.random() * missing.length)]; player.parts.push(id); popup(player.x, player.y - 50, `ご褒美：${PMAP[id].name}`, '#7dff8a'); }
      score += 200; nextWave();
    }
  }
  if (state === 'dying'){ overTimer -= dt; if (overTimer <= 0) gameOver(); }

  // カメラ
  const tx = player.x + player.vx * .3, ty = player.y + player.vy * .2;
  cam.x = wrap(cam.x + dxw(cam.x, tx) * Math.min(1, 5 * dt));
  cam.y += (ty - cam.y) * Math.min(1, 5 * dt);
  cam.y = clamp(cam.y, CEIL - 200, GY - (ch / 2) / zoom + 90);
  shake = Math.max(0, shake - 40 * dt);
}

// ---------- 描画 ----------
let shx = 0, shy = 0;
const SX = x => cw/2 + dxw(cam.x, x) * zoom + shx;
const SY = y => ch/2 + (y - cam.y) * zoom + shy;
function onScreen(x, y, m){ const sx = SX(x), sy = SY(y); return sx > -m && sx < cw + m && sy > -m && sy < ch + m; }

const STARS = Array.from({length:120}, () => ({x:Math.random()*W, y:rnd(-1600, 200), r:rnd(.5,1.6), tw:rnd(0,TAU)}));
const CLOUDS = [ .25, .5, .8 ].map((p, li) => ({p, list:Array.from({length:10 + li*4}, () => ({x:Math.random()*W, y:rnd(-500, 650), s:rnd(.6,1.4), blobs:Array.from({length:6}, () => [rnd(-70,70), rnd(-14,14), rnd(22,44)])}))}));
function layerX(x, p){ return cw/2 + dxw(wrap(cam.x * p), x) * zoom * (0.6 + p*.4); }
function layerY(y, p){ return ch/2 + (y - cam.y * p - 250 * (1 - p)) * zoom; }

function drawSky(){
  const top = SY(CEIL - 1100), bot = SY(GY);
  const g = ctx.createLinearGradient(0, top, 0, bot);
  g.addColorStop(0,'#0e0428'); g.addColorStop(.42,'#4a1868'); g.addColorStop(.72,'#c23d6e'); g.addColorStop(.9,'#ff8a5c'); g.addColorStop(1,'#ffc27a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
  for (const s of STARS){
    const sx = layerX(s.x, .1), sy = layerY(s.y, .1);
    const a = clamp((SY(GY - 300) - sy) / 600, 0, 1) * (.5 + .5 * Math.sin(time * 2 + s.tw));
    if (a <= 0.02 || sy < -5 || sy > ch) continue;
    ctx.fillStyle = `rgba(255,244,220,${a})`; ctx.fillRect(sx, sy, s.r * 1.4, s.r * 1.4);
  }
  // 夕日
  const sunX = cw/2 + dxw(wrap(cam.x * .05), 1200) * zoom * .3, sunY = SY(GY) - 30 * zoom, r = 130 * zoom;
  const sg = ctx.createRadialGradient(sunX, sunY, r * .2, sunX, sunY, r * 2.4);
  sg.addColorStop(0,'rgba(255,220,140,.55)'); sg.addColorStop(1,'rgba(255,140,90,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, cw, ch);
  const sg2 = ctx.createLinearGradient(0, sunY - r, 0, sunY + r);
  sg2.addColorStop(0,'#ffe9a8'); sg2.addColorStop(1,'#ff7a4a');
  ctx.fillStyle = sg2; ctx.beginPath(); ctx.arc(sunX, sunY, r, 0, TAU); ctx.fill();
  return {sunX};
}
function drawClouds(layer, alpha){
  const {p, list} = layer;
  for (const c of list){
    const x = layerX(c.x, p), y = layerY(c.y, p);
    if (x < -200 || x > cw + 200 || y < -120 || y > ch + 120) continue;
    const s = c.s * zoom * (.6 + p * .5);
    ctx.fillStyle = `rgba(255,${170 + p*40|0},${200 + p*20|0},${alpha})`;
    for (const [bx, by, br] of c.blobs){ ctx.beginPath(); ctx.arc(x + bx*s, y + by*s, br*s, 0, TAU); ctx.fill(); }
    ctx.fillStyle = `rgba(120,40,110,${alpha * .5})`;
    ctx.fillRect(x - 70*s, y + 12*s, 140*s, 6*s);
  }
}
function drawSea(sunX){
  const y0 = SY(GY);
  if (y0 > ch) return;
  const g = ctx.createLinearGradient(0, y0, 0, ch);
  g.addColorStop(0,'#3b2a7a'); g.addColorStop(1,'#0b0726');
  ctx.fillStyle = g; ctx.fillRect(0, y0, cw, ch - y0);
  ctx.fillStyle = '#ffc27a'; ctx.fillRect(0, y0, cw, 2);
  for (let row = 0; row < 14; row++){
    const yy = y0 + 6 + row * row * 2.2 * zoom + row * 5 * zoom;
    if (yy > ch) break;
    const off = (cam.x * (0.4 + row * .08) + time * 20 * (row % 2 ? 1 : -1)) % 60;
    for (let x = -60 - off; x < cw + 60; x += 60){
      const near = Math.max(0, 1 - Math.abs(x - sunX) / (180 * zoom + row * 10));
      ctx.fillStyle = near > 0 ? `rgba(255,200,120,${.25 + near * .6})` : 'rgba(170,150,255,.18)';
      ctx.fillRect(x + (row * 17) % 30, yy, (14 + row * 2) * zoom * (near > 0 ? 1.5 : 1), 1.6);
    }
  }
}
function drawPlane(pl){
  if (!onScreen(pl.x, pl.y, 120)) return;
  ctx.save();
  ctx.translate(SX(pl.x), SY(pl.y)); ctx.scale(zoom, zoom); ctx.rotate(pl.a);
  if (Math.cos(pl.a) < 0) ctx.scale(1, -1);
  if (pl.inv > 0 && Math.floor(time * 20) % 2) ctx.globalAlpha = .4;
  const has = new Set(pl.parts), t = pl.t;
  for (const id of BACK) if (has.has(id)) PD[id](t);
  drawBody(pl.team);
  for (const id of FRONT) if (has.has(id) && id !== 'drill') PD[id](t);
  drawProp(t, has.has('goldprop'));
  if (has.has('drill')) PD.drill(t);
  ctx.restore();
}
function drawPickup(p){
  if (!onScreen(p.x, p.y, 80)) return;
  if (p.life < 3 && Math.floor(time * 8) % 2) return;
  const sx = SX(p.x), sy = SY(p.y);
  ctx.save(); ctx.translate(sx, sy); ctx.scale(zoom, zoom);
  const pulse = 1 + .12 * Math.sin(time * 8);
  ctx.fillStyle = 'rgba(255,216,74,.18)'; ctx.beginPath(); ctx.arc(0, 0, 26 * pulse, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,243,176,.7)'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]); ctx.lineDashOffset = -time * 20;
  ctx.beginPath(); ctx.arc(0, 0, 26 * pulse, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  ctx.save(); ctx.rotate(p.rot); ctx.scale(1.15, 1.15);
  const d = PMAP[p.id]; ctx.translate(-d.ax, -d.ay); PD[p.id](time);
  ctx.restore();
  ctx.font = '800 11px ' + JPF; ctx.textAlign = 'center';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(20,7,43,.85)'; ctx.strokeText(d.name, 0, 42); ctx.fillStyle = '#fff3b0'; ctx.fillText(d.name, 0, 42);
  ctx.restore();
}
function drawIndicators(){
  for (const e of enemies){
    const sx = SX(e.x), sy = SY(e.y);
    if (sx > 0 && sx < cw && sy > 0 && sy < ch) continue;
    const ax = clamp(sx, 24, cw - 24), ay = clamp(sy, 90, ch - 24), a = Math.atan2(sy - ch/2, sx - cw/2);
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
    ctx.fillStyle = '#9fe3ff'; poly([[12,0],[-7,-8],[-3,0],[-7,8]]); ctx.fill();
    ctx.restore();
  }
  for (const p of pickups){
    const sx = SX(p.x), sy = SY(p.y);
    if (sx > 0 && sx < cw && sy > 0 && sy < ch) continue;
    const ax = clamp(sx, 20, cw - 20), ay = clamp(sy, 90, ch - 20);
    ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(ax, ay, 4 + Math.sin(time*8), 0, TAU); ctx.fill();
  }
}

function render(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  shx = shake ? rnd(-shake, shake) : 0; shy = shake ? rnd(-shake, shake) : 0;
  const {sunX} = drawSky();
  drawClouds(CLOUDS[0], .35); drawClouds(CLOUDS[1], .45);
  drawSea(sunX);
  for (const p of pickups) drawPickup(p);
  for (const q of parts){
    if (!onScreen(q.x, q.y, 30)) continue;
    const a = clamp(q.life / q.max, 0, 1), x = SX(q.x), y = SY(q.y), s = q.size * zoom;
    ctx.globalAlpha = q.type === 'smoke' ? a : Math.min(1, a * 1.5);
    ctx.fillStyle = q.color;
    if (q.type === 'glitter'){ ctx.beginPath(); ctx.moveTo(x, y - s*2); ctx.lineTo(x + s*.5, y); ctx.lineTo(x, y + s*2); ctx.lineTo(x - s*.5, y); ctx.closePath(); ctx.fill(); ctx.fillRect(x - s*2, y - s*.25, s*4, s*.5); }
    else { ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const e of enemies) drawPlane(e);
  if (player && player.alive) drawPlane(player);
  for (const b of bullets){
    if (!onScreen(b.x, b.y, 20)) continue;
    const x = SX(b.x), y = SY(b.y), k = .018 * zoom;
    ctx.strokeStyle = b.team ? '#ff5a5a' : '#fff3b0'; ctx.lineWidth = (b.team ? 3.2 : 2.6) * zoom; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - b.vx * k, y - b.vy * k); ctx.stroke();
  }
  drawClouds(CLOUDS[2], .55);
  ctx.textAlign = 'center';
  for (const p of popups){
    const x = SX(p.x), y = SY(p.y);
    ctx.globalAlpha = clamp(p.life / .4, 0, 1);
    ctx.font = `800 ${Math.round(15 * Math.max(.85, zoom))}px ${JPF}`;
    ctx.lineWidth = 4; ctx.strokeStyle = '#14072b'; ctx.strokeText(p.text, x, y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, x, y);
  }
  ctx.globalAlpha = 1;
  if (state === 'play' || state === 'dying') drawIndicators();
  if (banner && state === 'play'){
    const a = clamp(banner.life / .4, 0, 1), sc = 1 + Math.max(0, banner.life - 1.8) * .8;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(cw/2, ch * .38); ctx.scale(sc, sc);
    const fs = Math.min(72, cw / 7);
    ctx.font = `900 ${fs}px ${JPF}`;
    ctx.fillStyle = '#14072b'; ctx.fillText(banner.text, 5, 5);
    ctx.fillStyle = '#e2366f'; ctx.fillText(banner.text, 2.5, 2.5);
    ctx.fillStyle = '#ffd84a'; ctx.fillText(banner.text, 0, 0);
    ctx.font = `800 ${Math.max(14, fs * .26)}px ${JPF}`;
    ctx.fillStyle = '#fff4dc'; ctx.fillText(banner.sub, 0, fs * .55);
    ctx.restore();
  }
}

// タイトル画面のデモ飛行
player = makePlane(0, 300, 0, 0, ALL);
let last = performance.now();
function loop(now){
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  pollPad(); update(dt); render(); updateHud();
  if (toast){
    toast.life -= dt;
    ctx.globalAlpha = clamp(toast.life / .4, 0, 1);
    ctx.font = '800 15px ' + JPF; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#14072b'; ctx.strokeText(toast.text, cw/2, ch - 40);
    ctx.fillStyle = '#9fe3ff'; ctx.fillText(toast.text, cw/2, ch - 40);
    ctx.globalAlpha = 1;
    if (toast.life <= 0) toast = null;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
